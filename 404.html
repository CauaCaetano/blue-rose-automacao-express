<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,680&family=Archivo:wght@400;500;600&display=swap');
  :root{ --bg:#05070d; --ink:#eef2ff; --ink-soft:#9fb0dd; --line:rgba(148,178,255,0.16); --rose:#4f7dff; --focus:#4fd6ff; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:32px 20px;
    background:
      radial-gradient(40% 50% at 70% 30%, rgba(79,125,255,0.22) 0%, rgba(79,125,255,0) 70%),
      radial-gradient(35% 45% at 20% 80%, rgba(0,212,255,0.14) 0%, rgba(0,212,255,0) 72%),
      var(--bg);
    color:var(--ink); font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; line-height:1.5;
  }
  main{ max-width:560px; text-align:center; }
  img{ width:132px; height:auto; filter:drop-shadow(0 0 40px rgba(79,125,255,0.55)); }
  h1{ font-family:'Fraunces',Georgia,serif; font-weight:680; font-size:clamp(28px,6vw,40px); line-height:1.1; margin:18px 0 10px; text-wrap:balance; }
  p{ color:var(--ink-soft); margin:0 auto; max-width:44ch; text-wrap:pretty; }
  .en{ margin-top:6px; font-size:14px; }
  .acoes{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
  a{ display:inline-flex; align-items:center; padding:12px 20px; border-radius:3px; font-weight:600; font-size:14.5px; text-decoration:none; color:var(--ink); border:1px solid var(--line); transition:background-color .2s ease, border-color .2s ease; }
  a.principal{ background:var(--rose); border-color:var(--rose); color:#fff; }
  a.principal:hover{ background:#3d6cf0; }
  a:not(.principal):hover{ border-color:var(--focus); }
  a:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  a:active{ transform:translateY(1px); }
</style>
</head>
<body>
<main>
  <img src="/blue-rose-automacao-express/img/blue-rose-mark.webp" alt="" width="640" height="620">

  <p class="en" lang="en">This page doesn’t exist. Everything is on the home page.</p>
  <div class="acoes">
    <a class="principal" href="/blue-rose-automacao-express/">Ir para a página inicial</a>
