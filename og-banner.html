<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,680;1,9..144,560&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; width:1200px; height:630px; overflow:hidden; }
  body{
    font-family:'Archivo',sans-serif;
    background:
      radial-gradient(560px 460px at 88% 8%, #fbe7ed 0%, transparent 70%),
      radial-gradient(420px 360px at 100% 65%, #f2b6c6 0%, transparent 65%),
      #f2f3f8;
    color:#12213b;
    position:relative;
  }
  .wrap{ display:flex; align-items:center; height:100%; padding:0 90px; gap:56px; position:relative; z-index:1; }
  .logo{ width:190px; height:190px; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 24px 48px -16px rgba(18,33,59,.28); flex:none; }
  .text{ display:flex; flex-direction:column; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:19px; letter-spacing:.09em; text-transform:uppercase; color:#8f1338; }
  h1{ font-family:'Fraunces',serif; font-weight:680; font-size:64px; margin:14px 0 0; line-height:1.05; color:#12213b; }
  p{ font-family:'Archivo',sans-serif; font-size:26px; color:#3c4c6e; margin:20px 0 0; max-width:20ch; line-height:1.4; }
  .rose-flourish{ position:absolute; right:-60px; top:50%; transform:translateY(-50%); width:520px; height:520px; opacity:.12; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rose-mark" viewBox="0 0 44 44">
    <g>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7"/>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7" transform="rotate(60 22 22)"/>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7" transform="rotate(120 22 22)"/>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7" transform="rotate(180 22 22)"/>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7" transform="rotate(240 22 22)"/>
      <path d="M22,22 C13,20 10,9 22,2 C34,9 31,20 22,22 Z" fill="#4C6FE0" stroke="#1C2F52" stroke-width="0.7" transform="rotate(300 22 22)"/>
      <circle cx="22" cy="22" r="2.6" fill="#D6335F" stroke="#1C2F52" stroke-width="0.4"/>
    </g>
  </symbol>
</svg>
<svg class="rose-flourish" viewBox="0 0 44 44" aria-hidden="true"><use href="#rose-mark"/></svg>
<div class="wrap">
  <img class="logo" src="img/blue-rose-logo.jpg" alt="">
  <div class="text">
    <div class="eyebrow">Sites &amp; automação pra negócios locais</div>
    <h1>BLUE ROSE</h1>
    <p>Site simples ou completo + automação de WhatsApp, pronto em poucos dias.</p>
  </div>
</div>
</body>
</html>
